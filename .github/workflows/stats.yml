name: stats

on:
  schedule:
    - cron: "17 4 * * *"   # cada día, 04:17 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: stats
  cancel-in-progress: true

jobs:
  stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Generar assets/stats*.svg
        run: python3 scripts/assets.py stats
        env:
          GH_TOKEN: ${{ secrets.METRICS_TOKEN }}
      - name: Commit solo si hay cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/stats.svg assets/stats-m.svg
          git diff --cached --quiet || { git commit -m "chore: actualizar actividad"; git push; }
